# SlideFidelity license API (U14, KTD7/KTD8/KTD9).
name = "slidefidelity-license-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "api.slidefidelity.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "slidefidelity-license"
database_id = "af1b7d85-2dd8-43a6-a9ad-cb23f8c04d34"
migrations_dir = "migrations"

# Daily housekeeping: purge expired OTP codes, sessions, and rate-limit windows.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Comma-separated list of browser origins allowed by CORS (add-in + site).
ALLOWED_ORIGINS = "https://app.slidefidelity.com,https://slidefidelity.com"
# Public website base URL used for account-bound checkout links.
SITE_URL = "https://slidefidelity.com"
# Key id placed in entitlement tokens; bump when rotating ENTITLEMENT_PRIVATE_KEY.
ENTITLEMENT_KID = "ent-2026-09"
# "sandbox" or "production" (selects the Paddle API host).
PADDLE_ENV = "production"
# Sent through Resend from openitsystems.com (verified there); move to @slidefidelity.com once that domain is added in Resend.
EMAIL_FROM = "SlideFidelity <signin@openitsystems.com>"
# AppSource reviewer account (code comes from the REVIEWER_CODE secret).
REVIEWER_EMAIL = "appsource-review@slidefidelity.com"
# Abuse limits (optional overrides; defaults live in src/ratelimit.ts).
LINKCHECK_GLOBAL_DAILY_URL_CAP = "20000"

# Secrets (set with `wrangler secret put <NAME>`; never commit values):
#   SESSION_SECRET          HMAC key for session JWTs and OTP hashing pepper (>= 32 random bytes)
#   ENTITLEMENT_PRIVATE_KEY Ed25519 private key as JWK JSON (see scripts/generate-entitlement-key.mjs)
#   PADDLE_WEBHOOK_SECRET   Paddle notification destination secret key
#   PADDLE_API_KEY          Paddle API key (subscription cancel, customer portal)
#   EMAIL_API_KEY           Resend API key (sending domain must be verified in Resend with SPF + DKIM)
#   REVIEWER_CODE           Static sign-in code for REVIEWER_EMAIL (AppSource validation)
